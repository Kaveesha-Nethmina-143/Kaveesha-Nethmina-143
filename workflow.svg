<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Animated build loop">
<defs><linearGradient id="g"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="238" rx="20" fill="#0b1020" stroke="#27253f"/>
<path d="M120 90H1080" stroke="url(#g)" opacity=".3" stroke-width="2"/>
<circle r="5" fill="#22d3ee"><animateMotion path="M120 90H1080" dur="5s" repeatCount="indefinite"/></circle>
<path d="M1080 157v30H120v-30" fill="none" stroke="#a78bfa" opacity=".35" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" from="0" to="104" dur="6s" repeatCount="indefinite"/></path>

<circle cx="150" cy="90" r="27" fill="#11182b" stroke="#22d3ee"/><circle cx="150" cy="90" r="29" fill="none" stroke="#22d3ee" opacity=".4"><animate attributeName="r" values="29;38;29" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
<text x="150" y="96" text-anchor="middle" font-family="monospace" font-size="16" fill="#22d3ee">01</text><text x="150" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="2" fill="#f1f5f9">IMAGINE</text><text x="150" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">Find the idea</text>
<circle cx="450" cy="90" r="27" fill="#11182b" stroke="#818cf8"/><circle cx="450" cy="90" r="29" fill="none" stroke="#818cf8" opacity=".4"><animate attributeName="r" values="29;38;29" dur="4s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
<text x="450" y="96" text-anchor="middle" font-family="monospace" font-size="16" fill="#818cf8">02</text><text x="450" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="2" fill="#f1f5f9">DESIGN</text><text x="450" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">Shape the experience</text>
<circle cx="750" cy="90" r="27" fill="#11182b" stroke="#a78bfa"/><circle cx="750" cy="90" r="29" fill="none" stroke="#a78bfa" opacity=".4"><animate attributeName="r" values="29;38;29" dur="4s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
<text x="750" y="96" text-anchor="middle" font-family="monospace" font-size="16" fill="#a78bfa">03</text><text x="750" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="2" fill="#f1f5f9">DEVELOP</text><text x="750" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">Bring it to life</text>
<circle cx="1050" cy="90" r="27" fill="#11182b" stroke="#f472b6"/><circle cx="1050" cy="90" r="29" fill="none" stroke="#f472b6" opacity=".4"><animate attributeName="r" values="29;38;29" dur="4s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
<text x="1050" y="96" text-anchor="middle" font-family="monospace" font-size="16" fill="#f472b6">04</text><text x="1050" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="2" fill="#f1f5f9">REFINE</text><text x="1050" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">Make it better</text>
<text x="600" y="220" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="3" fill="#a78bfa">REPEAT THE PROCESS. RAISE THE STANDARD.</text></svg>