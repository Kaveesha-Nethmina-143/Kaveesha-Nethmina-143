<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Kaveesha Nethmina — Code. Create. Repeat.">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b18"/><stop offset="1" stop-color="#17102f"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9384c5" stroke-opacity=".12"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="380" rx="24" fill="url(#bg)"/>
<rect width="1200" height="380" rx="24" fill="url(#grid)"/>
<circle cx="1060" cy="185" r="120" fill="#a78bfa" opacity=".05"/>
<g fill="none" stroke="url(#neon)" transform="translate(1050 185)">
 <circle r="100" stroke-opacity=".15"/>
 <circle r="77" stroke-width="2" stroke-dasharray="110 32 10 32"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
 <circle r="105" stroke-dasharray="38 120" stroke-opacity=".7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="35s" repeatCount="indefinite"/></circle>
 <path d="M-23-20L-45 0l22 20M23-20L45 0 23 20M12-35L-12 35" stroke-width="4" stroke-linecap="round"/>
</g>
<path d="M36 36h55M36 36v35M1164 344h-55M1164 344v-35" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".7"/>
<circle cx="72" cy="79" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
<text x="90" y="84" font-family="monospace" font-size="13" letter-spacing="3" fill="#94a3b8">WELCOME TO MY DIGITAL SPACE</text>
<text x="65" y="162" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#f8fafc">KAVEESHA</text>
<text x="65" y="235" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#neon)">NETHMINA</text>
<text x="69" y="285" font-family="monospace" font-size="17" letter-spacing="5" fill="#c4b5fd">CODE. CREATE. REPEAT.</text>
<rect x="69" y="309" width="590" height="2" rx="1" fill="url(#neon)" opacity=".25"/>
<rect x="69" y="309" width="70" height="2" rx="1" fill="#22d3ee"><animate attributeName="x" values="69;589;69" dur="6s" repeatCount="indefinite"/></rect>
<g fill="#c4b5fd"><circle cx="835" cy="65" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="760" cy="290" r="2"><animate attributeName="opacity" values="1;.1;1" dur="5s" repeatCount="indefinite"/></circle><circle cx="1130" cy="70" r="2"/></g>
</svg>
